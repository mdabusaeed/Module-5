{% comment %} {% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static "css/output.css" %}">
</head>
<body>
    <div class='w-1/2 mx-auto mt-8'>
        <div>
            {% if message %}
                <p>{{message}}</p>
            {% endif %}
        </div>
        <form method="POST">
            
            {% csrf_token %}
            {{ form.as_p }}
            <button type="Submit" >Submit</button>
        </form>
    </div>
</body>
</html>    {% endcomment %}


''' For More vibrant Color'''
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100">
    <div class="w-full min-h-screen flex items-center justify-center">
        <div class="w-1/2 mx-auto mt-10 bg-gradient-to-r from-indigo-200 via-purple-200 to-pink-200 p-8 rounded-lg shadow-2xl">
            <h2 class="text-3xl font-bold text-purple-800 mb-6 text-center">Task Management System</h2>
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="bg-gradient-to-r from-rose-400 to-red-500 text-white px-6 py-2 rounded-full shadow-lg hover:from-rose-500 hover:to-red-600 transition duration-300">
                    Submit Your Task
                </button>
            </form>
        </div>
    </div>
</body>
</html>
